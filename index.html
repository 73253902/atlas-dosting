<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dosting Toys — Portal de Pedidos</title>
<style>
:root{--azul:#1A3A5C;--azul-claro:#2A5080;--dorado:#C9860A;--dorado-claro:#F0A820;--gris:#F5F6F8;--gris-medio:#E8EAF0;--texto:#1A1A2E;--texto-suave:#6B7280;--blanco:#FFFFFF;--verde:#16A34A;--sombra:0 2px 12px rgba(26,58,92,.10);--sombra-hover:0 6px 24px rgba(26,58,92,.18);--radio:14px}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Segoe UI',system-ui,sans-serif;background:var(--gris);color:var(--texto);min-height:100vh}
.header{background:var(--azul);padding:14px 20px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:100;box-shadow:0 2px 8px rgba(0,0,0,.2)}
.logo{display:flex;align-items:center;gap:10px}
.logo-icon{width:38px;height:38px;background:var(--dorado);border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:20px}
.logo-text strong{display:block;font-size:16px;font-weight:700;color:white}
.logo-text span{font-size:11px;opacity:.7;color:white}
.cart-btn{background:var(--dorado);color:white;border:none;border-radius:10px;padding:8px 16px;font-size:14px;font-weight:600;cursor:pointer;display:flex;align-items:center;gap:8px}
.cart-count{background:white;color:var(--dorado);border-radius:50%;width:22px;height:22px;font-size:12px;font-weight:700;display:flex;align-items:center;justify-content:center}
.promo-banner{display:flex;gap:8px;padding:10px 20px;background:var(--azul-claro);overflow-x:auto}
.promo-pill{background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.2);border-radius:20px;padding:5px 14px;color:white;font-size:12px;white-space:nowrap}
.promo-pill strong{color:var(--dorado-claro)}
.main{max-width:1100px;margin:0 auto;padding:20px 16px}
.search-bar{background:white;border-radius:var(--radio);padding:12px 16px;display:flex;gap:10px;margin-bottom:16px;box-shadow:var(--sombra)}
.search-input{flex:1;border:none;outline:none;font-size:15px;color:var(--texto)}
.cats{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;margin-bottom:20px}
.cat-btn{padding:6px 16px;border-radius:20px;border:1.5px solid var(--gris-medio);background:white;color:var(--texto-suave);font-size:13px;cursor:pointer;white-space:nowrap;font-weight:500;transition:all .2s}
.cat-btn.active{background:var(--azul);border-color:var(--azul);color:white}
.section-title{font-size:12px;font-weight:600;color:var(--texto-suave);text-transform:uppercase;letter-spacing:.04em;margin-bottom:14px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:12px;margin-bottom:30px}
.prod-card{background:white;border-radius:var(--radio);overflow:hidden;box-shadow:var(--sombra);transition:all .2s;border:2px solid transparent}
.prod-card:hover{box-shadow:var(--sombra-hover);transform:translateY(-2px)}
.prod-card.activo{border-color:var(--verde)}
.prod-img{width:100%;aspect-ratio:1;background:var(--gris);display:flex;align-items:center;justify-content:center;font-size:44px;position:relative}
.prod-img img{width:100%;height:100%;object-fit:cover}
.badge-var{position:absolute;top:8px;right:8px;background:var(--azul);color:white;font-size:10px;font-weight:700;padding:3px 8px;border-radius:20px}
.prod-body{padding:10px 12px 12px}
.prod-codigo{font-size:10px;color:var(--texto-suave);font-family:monospace;margin-bottom:3px}
.prod-nombre{font-size:12px;font-weight:600;line-height:1.4;min-height:34px;margin-bottom:6px}
.prod-precio{font-size:15px;font-weight:700;color:var(--azul);margin-bottom:10px}
/* ── CONTROLES DE CANTIDAD ── */
.qty-row{display:flex;align-items:center;justify-content:space-between;gap:6px}
.qty-menos,.qty-mas{width:36px;height:36px;border-radius:10px;border:none;font-size:22px;font-weight:700;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all .15s;flex-shrink:0}
.qty-menos{background:var(--gris);color:var(--azul)}
.qty-menos:hover{background:var(--gris-medio)}
.qty-mas{background:var(--azul);color:white}
.qty-mas:hover{background:var(--azul-claro)}
.qty-num{font-size:22px;font-weight:800;min-width:32px;text-align:center;transition:color .15s}
.qty-num.cero{color:#CCCCCC}
.qty-num.positivo{color:var(--azul)}
/* variante button */
.btn-var{width:100%;padding:9px;background:var(--azul);color:white;border:none;border-radius:10px;font-size:12px;font-weight:600;cursor:pointer;transition:background .2s}
.btn-var:hover{background:var(--azul-claro)}
.btn-var.activo{background:var(--verde)}
/* ── MODAL ── */
.modal-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:200;align-items:flex-end;justify-content:center}
.modal-overlay.open{display:flex}
.modal{background:white;border-radius:20px 20px 0 0;padding:24px 20px;width:100%;max-width:520px;max-height:85vh;overflow-y:auto;animation:slideUp .25s ease}
@keyframes slideUp{from{transform:translateY(100%)}to{transform:translateY(0)}}
.modal-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px}
.modal-title{font-size:17px;font-weight:700}
.modal-close{background:var(--gris);border:none;border-radius:50%;width:32px;height:32px;cursor:pointer;font-size:18px}
.var-item{display:flex;align-items:center;justify-content:space-between;padding:12px 0;border-bottom:1px solid var(--gris)}
.var-item:last-child{border-bottom:none}
.var-info strong{font-size:14px;font-weight:600;display:block}
.var-info span{font-size:11px;color:var(--texto-suave);font-family:monospace}
.var-precio{font-size:14px;font-weight:700;color:var(--azul);margin-right:12px}
.var-qty-row{display:flex;align-items:center;gap:8px}
.vqb{width:30px;height:30px;border-radius:8px;border:none;font-size:18px;font-weight:700;cursor:pointer;display:flex;align-items:center;justify-content:center}
.vqb.menos{background:var(--gris);color:var(--azul)}
.vqb.mas{background:var(--azul);color:white}
.vqb-num{font-size:16px;font-weight:700;min-width:24px;text-align:center}
.vqb-num.cero{color:#CCCCCC}
.vqb-num.positivo{color:var(--azul)}
/* ── CARRITO ── */
.cart-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:300}
.cart-overlay.open{display:block}
.cart-panel{position:fixed;right:0;top:0;bottom:0;width:100%;max-width:420px;background:white;z-index:301;display:flex;flex-direction:column;transform:translateX(100%);transition:transform .3s ease;box-shadow:-4px 0 24px rgba(0,0,0,.15)}
.cart-panel.open{transform:translateX(0)}
.cart-header{padding:20px;border-bottom:1px solid var(--gris);display:flex;justify-content:space-between;align-items:center}
.cart-title{font-size:18px;font-weight:700}
.cart-body{flex:1;overflow-y:auto;padding:16px 20px}
.ci{display:flex;gap:12px;padding:10px 0;border-bottom:1px solid var(--gris)}
.ci:last-child{border-bottom:none}
.ci-info{flex:1}
.ci-nombre{font-size:13px;font-weight:600}
.ci-codigo{font-size:11px;color:var(--texto-suave);font-family:monospace}
.ci-meta{display:flex;justify-content:space-between;align-items:center;margin-top:5px}
.ci-precio{font-size:13px;font-weight:700;color:var(--azul)}
.ci-qty{display:flex;align-items:center;gap:4px;background:var(--gris);border-radius:6px;padding:2px 6px}
.cqb{width:20px;height:20px;border:none;background:none;font-size:16px;font-weight:700;cursor:pointer;color:var(--azul)}
.cart-footer{padding:20px;border-top:1px solid var(--gris)}
.prog-bar{height:5px;background:var(--gris);border-radius:3px;overflow:hidden;margin-bottom:4px}
.prog-fill{height:100%;border-radius:3px;transition:width .4s}
.prog-label{font-size:11px;color:var(--texto-suave);margin-bottom:12px}
.resumen{background:var(--gris);border-radius:10px;padding:12px;margin-bottom:12px}
.r-row{display:flex;justify-content:space-between;font-size:13px;padding:3px 0}
.r-row.total{font-size:17px;font-weight:700;border-top:1px solid var(--gris-medio);margin-top:6px;padding-top:8px}
.r-desc{color:var(--verde);font-weight:600}
.badge-desc{background:#DCFCE7;color:var(--verde);font-size:10px;padding:2px 7px;border-radius:20px;font-weight:600}
.btn-enviar{width:100%;padding:13px;background:var(--dorado);color:white;border:none;border-radius:12px;font-size:15px;font-weight:700;cursor:pointer}
.btn-vaciar{width:100%;padding:9px;background:none;border:1.5px solid var(--gris-medio);border-radius:10px;font-size:13px;color:var(--texto-suave);cursor:pointer;margin-top:8px}
.empty-cart{text-align:center;padding:40px 20px;color:var(--texto-suave)}
@media(max-width:600px){.grid{grid-template-columns:repeat(2,1fr);gap:10px}.cart-panel{max-width:100%}}
</style>
</head>

async function cargarProductosSupabase() {
  try {
    var todas_familias = [];
    var pagina = 0;
    var tamPagina = 500;
    var seguir = true;

    // Cargar familias con paginación
    while(seguir) {
      var desde = pagina * tamPagina;
      var url = SUPABASE_URL + '/rest/v1/families?empresa_id=eq.' + EMPRESA_ID 
        + '&select=id,family_name,image_url'
        + '&order=family_name.asc&limit=' + tamPagina + '&offset=' + desde
        + '&apikey=' + ANON_KEY;
      
      var resp = await fetch(url, {
        headers: { 'apikey': ANON_KEY, 'Authorization': 'Bearer ' + ANON_KEY }
      });
      if(!resp.ok) throw new Error('Status: ' + resp.status);
      var data = await resp.json();
      todas_familias = todas_familias.concat(data);
      console.log('📦 Familias página ' + (pagina+1) + ': ' + data.length + ' (total: ' + todas_familias.length + ')');
      if(data.length < tamPagina) seguir = false;
      pagina++;
      if(pagina > 10) seguir = false;
    }

    // Cargar SKUs
    var todos_skus = [];
    pagina = 0;
    seguir = true;
    while(seguir) {
      var desde = pagina * tamPagina;
      var url2 = SUPABASE_URL + '/rest/v1/skus?empresa_id=eq.' + EMPRESA_ID
        + '&select=sku,description,precio_venta,family_id'
        + '&limit=' + tamPagina + '&offset=' + desde
        + '&apikey=' + ANON_KEY;
      var resp2 = await fetch(url2, {
        headers: { 'apikey': ANON_KEY, 'Authorization': 'Bearer ' + ANON_KEY }
      });
      if(!resp2.ok) throw new Error('SKUs Status: ' + resp2.status);
      var data2 = await resp2.json();
      todos_skus = todos_skus.concat(data2);
      if(data2.length < tamPagina) seguir = false;
      pagina++;
      if(pagina > 10) seguir = false;
    }

    console.log('✅ ' + todas_familias.length + ' familias, ' + todos_skus.length + ' SKUs');

    // Construir mapa de SKUs por family_id
    var skus_por_familia = {};
    todos_skus.forEach(function(s) {
      if(!skus_por_familia[s.family_id]) skus_por_familia[s.family_id] = [];
      skus_por_familia[s.family_id].push(s);
    });

    // Construir estructura compatible con el portal
    var resultado = [];
    todas_familias.forEach(function(f) {
      var mis_skus = skus_por_familia[f.id] || [];
      resultado.push({
        codigo: mis_skus.length > 0 ? mis_skus[0].sku : 'FAM-' + f.id,
        nombre: f.family_name,
        precio_venta: mis_skus.length > 0 ? mis_skus[0].precio_venta : 0,
        imagen_url: f.image_url,
        familia: f.family_name,
        family_id: f.id,
        _skus: mis_skus
      });
    });

    return resultado;
  } catch(e) {
    console.error('Error cargando Supabase:', e);
    return [];
  }
}

function buildFamilias(productos) {
  var mapa = {};
  productos.forEach(function(p) {
    var fam = p.familia || p.nombre;
    var img = p.imagen_url || (STORAGE_URL + '/1.png');
    if(!mapa[fam]) {
      mapa[fam] = {
        id: 'F-' + Object.keys(mapa).length,
        familia: fam,
        cat: 'General',
        emoji: '📦',
        imagen: img,
        variantes: []
      };
    }
    // Agregar variantes desde _skus
    var skus = p._skus || [{sku: p.codigo, description: p.nombre, precio_venta: p.precio_venta}];
    skus.forEach(function(s) {
      mapa[fam].variantes.push({
        id: s.sku,
        nombre: s.description,
        precio: s.precio_venta || 0
      });
    });
  });
  return Object.values(mapa);
}

  {id:'F017',familia:'Cautín',cat:'Eléctrico',emoji:'⚡',variantes:[{id:'CUAT 30',nombre:'30W con soldadura',precio:9459},{id:'CAUT40',nombre:'40W',precio:7162},{id:'CAUT 60',nombre:'60W',precio:10135}]},

  {id:'F020',familia:'Disco Flap Yosef',cat:'Abrasivos',emoji:'🔵',variantes:[{id:'YT90-6YT',nombre:'#100 4.1/2"',precio:2162},{id:'YT90-8YT',nombre:'#120 4.1/2"',precio:2162},{id:'YT90-9YT',nombre:'#60 4.1/2"',precio:2135},{id:'YT90-14YT',nombre:'#80 4.1/2"',precio:2135}]},
];

// ── ESTADO ────────────────────────────────────────────────────
var carrito = {};
var catActual = 'Todas';
var busqActual = '';
var PAGINA_SIZE = 24;
var paginaActual = 0;
var familiasFiltradas = [];
var cargando = false;

function fmt(n){return '$'+Math.round(n).toLocaleString('es-CO')}

// ── CATEGORÍAS ────────────────────────────────────────────────
function iniciarCats() {
  var cats = ['Todas',...new Set(familias.map(function(f){return f.cat}))];
  var catsEl = document.getElementById('cats');
  catsEl.innerHTML = '';
  cats.forEach(function(c){
    var btn = document.createElement('button');
    btn.className = 'cat-btn'+(c==='Todas'?' active':'');
    btn.textContent = c;
    btn.onclick = function(){
      catActual = c;
      document.querySelectorAll('.cat-btn').forEach(function(b){b.classList.remove('active')});
      btn.classList.add('active');
      renderGrid();
    };
    catsEl.appendChild(btn);
  });
}

// ── RENDER GRID ───────────────────────────────────────────────
function filtrarFamilias(){
  var q = busqActual.toLowerCase();
  familiasFiltradas = familias.filter(function(f){
    var enCat = catActual==='Todas'||f.cat===catActual;
    var enBusq = !q||f.familia.toLowerCase().includes(q)||f.variantes.some(function(v){return v.id.toLowerCase().includes(q)||v.nombre.toLowerCase().includes(q)});
    return enCat&&enBusq;
  });
  paginaActual = 0;
  document.getElementById('grid').innerHTML = '';
  document.getElementById('section-label').textContent = familiasFiltradas.length+' productos';
  cargarPagina();
}

function cargarPagina(){
  if(cargando) return;
  var desde = paginaActual * PAGINA_SIZE;
  var hasta = desde + PAGINA_SIZE;
  var lote = familiasFiltradas.slice(desde, hasta);
  if(!lote.length) return;
  cargando = true;
  renderLote(lote);
  paginaActual++;
  cargando = false;
}

function renderGrid(){
  filtrarFamilias();
}

function renderLote(lista){
  var grid = document.getElementById('grid');
  lista.forEach(function(f){
    var esVar = f.variantes.length>1;
    var v0 = f.variantes[0];
    var totalQty = f.variantes.reduce(function(s,v){return s+(carrito[v.id]||0)},0);
    var qty0 = carrito[v0.id]||0;

    var accionesHTML = esVar
      ?'<button class="btn-var'+(totalQty>0?' activo':'')+'" onclick="abrirModal(''+f.id+'')">'+(totalQty>0?'✓ <span id="qtf-'+f.id+'">'+totalQty+'</span> en pedido':'Seleccionar medida')+'</button>'
      :'<div class="qty-row">'
        +'<button class="qty-menos" onclick="cambiarQty(''+v0.id+'',''+f.id+'',-1)">−</button>'
        +'<span class="qty-num '+(qty0>0?'positivo':'cero')+'" id="qt-'+v0.id+'">'+qty0+'</span>'
        +'<button class="qty-mas" onclick="cambiarQty(''+v0.id+'',''+f.id+'',1)">+</button>'
      +'</div>';

    var card = document.createElement('div');
    card.id = 'card-'+f.id;
    card.className = 'prod-card'+(totalQty>0?' activo':'');
    card.innerHTML =
      '<div class="prod-img">'
        +(f.imagen?'<img src="'+f.imagen+'" alt="'+f.familia+'" loading="lazy" onerror="this.parentNode.innerHTML='<span style=font-size:44px>📦</span>'">':`<span style="font-size:44px">${f.emoji}</span>`)
        +(esVar?'<span class="badge-var">'+f.variantes.length+' medidas</span>':'')
      +'</div>'
      +'<div class="prod-body">'
        +'<div class="prod-codigo">'+(esVar?f.variantes.slice(0,2).map(function(v){return v.id}).join(' · ')+(f.variantes.length>2?' ...':''):v0.id)+'</div>'
        +'<div class="prod-nombre">'+f.familia+'</div>'
        +'<div class="prod-precio">'+(v0.precio>0?(esVar?'Desde ':'')+fmt(v0.precio):'Consultar')+'</div>'
        +accionesHTML
      +'</div>';
    grid.appendChild(card);
  });

  // Agregar sentinel para scroll infinito
  var sentinel = document.getElementById('scroll-sentinel');
  if(!sentinel){
    sentinel = document.createElement('div');
    sentinel.id = 'scroll-sentinel';
    sentinel.style.height = '20px';
    grid.parentNode.appendChild(sentinel);
    
    var observer = new IntersectionObserver(function(entries){
      if(entries[0].isIntersecting && !cargando){
        cargarPagina();
      }
    }, {rootMargin: '200px'});
    observer.observe(sentinel);
  }
}

function renderGridLote(lista){
  var grid = document.getElementById('grid');
  lista.forEach(function(f){
    var esVar = f.variantes.length>1;
    var v0 = f.variantes[0];
    var totalQty = f.variantes.reduce(function(s,v){return s+(carrito[v.id]||0)},0);
    var enCarrito = totalQty>0;

    var card = document.createElement('div');
    card.id = 'card-'+f.id;
    card.className = 'prod-card'+(enCarrito?' activo':'');

    var accionesHTML = esVar

      : '<div class="qty-row">'
          +'<button class="qty-menos" onclick="cambiarQty(\''+v0.id+'\',\''+f.id+'\',-1)">−</button>'
          +'<span class="qty-num '+(qty0>0?'positivo':'cero')+'" id="qt-'+v0.id+'">'+qty0+'</span>'
          +'<button class="qty-mas" onclick="cambiarQty(\''+v0.id+'\',\''+f.id+'\',1)">+</button>'
        +'</div>';

    card.innerHTML =
      '<div class="prod-img">'
        +(f.imagen?'<img src="'+f.imagen+'" alt="'+f.familia+'">':`<span style="font-size:44px">${f.emoji}</span>`)
        +(esVar?'<span class="badge-var">'+f.variantes.length+' medidas</span>':'')
      +'</div>'
      +'<div class="prod-body">'
        +'<div class="prod-codigo">'+(esVar?f.variantes.slice(0,2).map(function(v){return v.id}).join(' · ')+(f.variantes.length>2?' ...':''):v0.id)+'</div>'
        +'<div class="prod-nombre">'+f.familia+'</div>'
        +'<div class="prod-precio">'+(v0.precio>0?(esVar?'Desde ':'')+fmt(v0.precio):'Consultar')+'</div>'
        +accionesHTML
      +'</div>';

    grid.appendChild(card);
  });
}

// ── CAMBIAR CANTIDAD (productos simples) ──────────────────────
function cambiarQty(id, fid, delta){
  var actual = carrito[id]||0;
  var nuevo = Math.max(0, actual+delta);
  if(nuevo===0) delete carrito[id];
  else carrito[id] = nuevo;

  // Actualizar número en la tarjeta SIN redibujar
  var el = document.getElementById('qt-'+id);
  if(el){
    el.textContent = nuevo;
    el.className = 'qty-num '+(nuevo>0?'positivo':'cero');
  }
  // Actualizar borde de la tarjeta
  var card = document.getElementById('card-'+fid);
  if(card) card.className = 'prod-card'+(nuevo>0?' activo':'');

  actualizarCarrito();
}

// ── MODAL VARIANTES ───────────────────────────────────────────
function abrirModal(fid){
  var f = familias.find(function(x){return x.id===fid});
  document.getElementById('modal-titulo').textContent = f.familia;
  document.getElementById('modal-body').innerHTML = f.variantes.map(function(v){
    var qty = carrito[v.id]||0;
    return '<div class="var-item">'
      +'<div class="var-info"><strong>'+v.nombre+'</strong><span>'+v.id+'</span></div>'
      +'<div style="display:flex;align-items:center">'
        +(v.precio>0?'<span class="var-precio">'+fmt(v.precio)+'</span>':'<span class="var-precio">Consultar</span>')
        +'<div class="var-qty-row">'
          +'<button class="vqb menos" onclick="cambiarModal(\''+v.id+'\',\''+fid+'\',-1)">−</button>'
          +'<span class="vqb-num '+(qty>0?'positivo':'cero')+'" id="vm-'+v.id+'">'+qty+'</span>'
          +'<button class="vqb mas" onclick="cambiarModal(\''+v.id+'\',\''+fid+'\',1)">+</button>'
        +'</div>'
      +'</div>'
    +'</div>';
  }).join('');
  document.getElementById('modal-overlay').classList.add('open');
}

// ── CAMBIAR CANTIDAD EN MODAL (variantes) ─────────────────────
function cambiarModal(id, fid, delta){
  var actual = carrito[id]||0;
  var nuevo = Math.max(0, actual+delta);
  if(nuevo===0) delete carrito[id];
  else carrito[id] = nuevo;

  // Actualizar número en el modal SIN cerrarlo
  var el = document.getElementById('vm-'+id);
  if(el){
    el.textContent = nuevo;
    el.className = 'vqb-num '+(nuevo>0?'positivo':'cero');
  }

  // Actualizar botón y borde de la tarjeta del catálogo
  var f = familias.find(function(x){return x.id===fid});
  var totalQty = f.variantes.reduce(function(s,v){return s+(carrito[v.id]||0)},0);
  var btnF = document.getElementById('card-'+fid);
  if(btnF) btnF.className = 'prod-card'+(totalQty>0?' activo':'');
  var qtf = document.getElementById('qtf-'+fid);
  if(qtf) qtf.textContent = totalQty;
  // Actualizar texto del botón si está en el catálogo
  var btnVar = btnF?btnF.querySelector('.btn-var'):null;
  if(btnVar){
    btnVar.className = 'btn-var'+(totalQty>0?' activo':'');
    btnVar.innerHTML = totalQty>0?'✓ <span id="qtf-'+fid+'">'+totalQty+'</span> en pedido':'Seleccionar medida';
  }

  actualizarCarrito();
}

function cerrarModal(e){
  if(!e||e.target===document.getElementById('modal-overlay'))
    document.getElementById('modal-overlay').classList.remove('open');
}

// ── CARRITO ───────────────────────────────────────────────────
function calcDesc(sub){
  if(sub>=500000) return {pct:10,tipo:'10% pedido +$500.000'};
  if(sub>=250000) return {pct:5,tipo:'5% pedido +$250.000'};
  return {pct:0,tipo:''};
}

function actualizarCarrito(){
  var ids = Object.keys(carrito);
  var count = ids.reduce(function(s,id){return s+carrito[id]},0);
  document.getElementById('cart-count').textContent = count;

  var body = document.getElementById('cart-body');
  var footer = document.getElementById('cart-footer');

  if(!ids.length){
    body.innerHTML='<div class="empty-cart"><p style="font-size:40px">🛒</p><p style="margin-top:8px">Tu pedido está vacío</p></div>';
    footer.style.display='none';
    return;
  }

  // Calcular subtotal
  var sub = ids.reduce(function(s,id){
    var f = familias.find(function(x){return x.variantes.some(function(v){return v.id===id})});
    var v = f?f.variantes.find(function(v){return v.id===id}):null;
    return s+(v?v.precio*carrito[id]:0);
  },0);

  var desc = calcDesc(sub);
  var descVal = Math.round(sub*desc.pct/100);
  var total = sub-descVal;

  // Render items
  body.innerHTML = ids.map(function(id){
    var f = familias.find(function(x){return x.variantes.some(function(v){return v.id===id})});
    var v = f?f.variantes.find(function(v){return v.id===id}):null;
    if(!f||!v) return '';
    return '<div class="ci">'
      +'<div style="font-size:28px;width:36px;text-align:center">'+f.emoji+'</div>'
      +'<div class="ci-info">'
        +'<div class="ci-nombre">'+f.familia+(f.variantes.length>1?' — '+v.nombre:'')+'</div>'
        +'<div class="ci-codigo">'+id+'</div>'
        +'<div class="ci-meta">'
          +'<div class="ci-precio">'+fmt(v.precio)+' c/u</div>'
          +'<div class="ci-qty">'
            +'<button class="cqb" onclick="cambiarCarrito(\''+id+'\',-1)">−</button>'
            +'<span style="font-size:13px;font-weight:700;min-width:20px;text-align:center">'+carrito[id]+'</span>'
            +'<button class="cqb" onclick="cambiarCarrito(\''+id+'\',1)">+</button>'
          +'</div>'
        +'</div>'
      +'</div>'
      +'<div style="font-size:13px;font-weight:700;color:var(--azul);min-width:65px;text-align:right">'+fmt(v.precio*carrito[id])+'</div>'
    +'</div>';
  }).join('');

  // Progress bar
  var pct = Math.min(100,Math.round(sub/500000*100));
  document.getElementById('prog-fill').style.width = pct+'%';
  document.getElementById('prog-fill').style.background = pct>=100?'var(--verde)':'var(--dorado)';
  document.getElementById('prog-label').textContent = pct>=100
    ?'✓ Descuento del 10% aplicado'
    :'Agrega '+fmt(500000-sub)+' más para el 10% de descuento';

  // Resumen
  document.getElementById('resumen').innerHTML =
    '<div class="r-row"><span>Subtotal</span><span>'+fmt(sub)+'</span></div>'
    +(desc.pct>0?'<div class="r-row"><span>Descuento <span class="badge-desc">'+desc.tipo+'</span></span><span class="r-desc">-'+fmt(descVal)+'</span></div>':'')
    +'<div class="r-row total"><span>Total a pagar</span><span>'+fmt(total)+'</span></div>';

  footer.style.display='block';
}

function cambiarCarrito(id, delta){
  // Encontrar la familia del producto
  var f = familias.find(function(x){return x.variantes.some(function(v){return v.id===id})});
  var esVar = f && f.variantes.length>1;

  if(esVar){
    cambiarModal(id, f.id, delta);
  } else {
    cambiarQty(id, f?f.id:'', delta);
  }
}

function toggleCart(){
  document.getElementById('cart-overlay').classList.toggle('open');
  document.getElementById('cart-panel').classList.toggle('open');
}

function vaciarCarrito(){
  carrito={};
  actualizarCarrito();
  renderGrid();
}

function enviarPedido(){
  var ids=Object.keys(carrito);
  if(!ids.length) return;
  var sub=ids.reduce(function(s,id){
    var f=familias.find(function(x){return x.variantes.some(function(v){return v.id===id})});
    var v=f?f.variantes.find(function(v){return v.id===id}):null;
    return s+(v?v.precio*carrito[id]:0);
  },0);
  var desc=calcDesc(sub);
  var descVal=Math.round(sub*desc.pct/100);
  var lineas=ids.map(function(id){
    var f=familias.find(function(x){return x.variantes.some(function(v){return v.id===id})});
    var v=f?f.variantes.find(function(v){return v.id===id}):null;
    return v?'• '+f.familia+(f.variantes.length>1?' — '+v.nombre:'')+' ('+id+') x'+carrito[id]+' = '+fmt(v.precio*carrito[id]):'';
  }).join('\n');
  var msg='PEDIDO DOSTING TOYS\n\n'+lineas+'\n\nSubtotal: '+fmt(sub)+(desc.pct>0?'\nDescuento '+desc.pct+'% ('+desc.tipo+'): -'+fmt(descVal):'')+'\nTOTAL: '+fmt(sub-descVal);
  if(typeof sendPrompt==='function') sendPrompt(msg);
  else window.open('https://wa.me/573332374299?text='+encodeURIComponent(msg),'_blank');
}

function filtrar(){busqActual=document.getElementById('busqueda').value;filtrarFamilias()}

// ── INICIAR DINÁMICO ─────────────────────────────────────────
async function iniciarPortal() {
  document.getElementById('grid').innerHTML = '<div style="grid-column:1/-1;text-align:center;padding:40px;color:var(--texto-suave)"><div style="font-size:40px">⏳</div><div style="margin-top:10px;font-size:14px">Cargando catálogo desde Supabase...</div></div>';
  try {
    var productos = await cargarProductosSupabase();
    if (productos && productos.length > 0) {
      familias = buildFamilias(productos);
      iniciarCats();
      renderGrid();
    } else {
      iniciarCats();
      renderGrid();
    }
  } catch(e) {
    iniciarCats();
    renderGrid();
  }
}

iniciarPortal();

</script>
